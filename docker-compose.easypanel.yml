services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in your EasyPanel environment}
      REQUIRE_STRONG_SECRET: "true"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in your EasyPanel environment}
      PREPARE_DATABASE_ON_STARTUP: "true"
      RESET_DATABASE_ON_STARTUP: ${RESET_DATABASE_ON_STARTUP:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in your EasyPanel environment}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      CSRF_ENABLED: "true"
      SECURITY_HEADERS_ENABLED: "true"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set APP_PUBLIC_URL in your EasyPanel environment}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-simulated}
      API_REQUEST_DEBUG: ${API_REQUEST_DEBUG:-false}
    volumes:
      - backend_instance:/app/instance
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://backend:5000
      API_PROXY_DEBUG: ${API_PROXY_DEBUG:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  backend_instance: