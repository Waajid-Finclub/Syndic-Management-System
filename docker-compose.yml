services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-syndic_ms}
      MYSQL_USER: ${MYSQL_USER:-syndic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in your EasyPanel environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in your EasyPanel environment}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in your EasyPanel environment}
      REQUIRE_STRONG_SECRET: "true"
      DATABASE_URL: mysql://${MYSQL_USER:-syndic}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-syndic_ms}
      PREPARE_DATABASE_ON_STARTUP: "true"
      RESET_DATABASE_ON_STARTUP: ${RESET_DATABASE_ON_STARTUP:-false}
      CORS_ORIGINS: ${APP_PUBLIC_URL:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      CSRF_ENABLED: "true"
      SECURITY_HEADERS_ENABLED: "true"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-simulated}
      API_REQUEST_DEBUG: ${API_REQUEST_DEBUG:-false}
    volumes:
      - backend_instance:/app/instance
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://backend:5000
      API_PROXY_DEBUG: ${API_PROXY_DEBUG:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
  backend_instance:
